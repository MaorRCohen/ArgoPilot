[project]
name = "registry-service"
version = "0.1.0"
description = "AgroPilot registry service."
requires-python = ">=3.12"
dependencies = [
    "fastapi~=0.115",
    "timezonefinder>=9.2.0",
    "uvicorn~=0.32",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "time-machine>=3.6.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["."]
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true
fail_under = 100