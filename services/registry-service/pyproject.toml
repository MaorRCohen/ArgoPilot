[project]
name = "registry-service"
version = "0.1.0"
description = "AgroPilot registry service."
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.44.13",
    "fastapi~=0.115",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.16.3",
    "python-multipart>=0.0.34",
    "sqlalchemy>=2.0",
    "timezonefinder>=9.2.0",
    "uvicorn~=0.32",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "time-machine>=3.6.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = ["sqlite_only: needs the SQLite backend (file-based behaviour)"]

[tool.coverage.run]
branch = true
source = ["."]
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true
fail_under = 100
