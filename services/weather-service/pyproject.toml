[project]
name = "weather-service"
version = "0.1.0"
description = "AgroPilot weather service."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.163.2",
    "httpx>=0.28.1",
    "pydantic-settings>=2.16.3",
    "uvicorn>=0.54.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "httpx2>=2.16.2",
    "pytest>=9.2.0",
    "time-machine>=3.6.0",
]
